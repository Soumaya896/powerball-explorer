# Put on Lb01 as /etc/nginx/sites-available/powerball-lb  (symlink into sites-enabled)
# Replace WEB01_IP and WEB02_IP with the real addresses of Web01 and Web02.
upstream powerball_backend {
    # round-robin by default: requests alternate Web01, Web02, Web01, ...
    server WEB01_IP:80 max_fails=3 fail_timeout=15s;
    server WEB02_IP:80 max_fails=3 fail_timeout=15s;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://powerball_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;  # failover if a server is down
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app already sends "X-Served-By: web-01/web-02"; this adds which upstream IP answered.
        add_header X-Upstream $upstream_addr always;
    }
}
