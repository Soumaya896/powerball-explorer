# ALTERNATIVE to nginx on Lb01: append this to /etc/haproxy/haproxy.cfg, then:  sudo systemctl reload haproxy
# Replace WEB01_IP and WEB02_IP.
frontend powerball_front
    bind *:80
    mode http
    default_backend powerball_back

backend powerball_back
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server web01 WEB01_IP:80 check
    server web02 WEB02_IP:80 check
